<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valentin Prodhomme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Valentin Prodhomme, étudiant en contrôle de gestion. Projets personnels autour de Power BI, n8n et de l’IA.">
<meta name="theme-color" content="#080808">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: one-screen stage with a convex 3D cylinder of project cards; header in the corners; About drawer slides from the right; case studies open as a full scroll overlay. */
:root{
  --bg:#080808;
  --panel:#111110;
  --panel-2:#181816;
  --fg:#ECEAE4;
  --mute:rgba(236,234,228,.56);
  --faint:rgba(236,234,228,.30);
  --line:rgba(236,234,228,.12);
  --accent:#7CC3AE;   /* favourable variance green, from the P&L dashboard */
  --neg:#E58A73;      /* overrun red */
  --f-sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --gx:max(16px, env(safe-area-inset-left,0px));
  --gxr:max(16px, env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.22,.8,.2,1);
  color-scheme:dark;
}
@media (min-width:760px){ :root{ --gx:max(40px, env(safe-area-inset-left,0px)); --gxr:max(40px, env(safe-area-inset-right,0px)); } }
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
ul,ol,figure,h1,h2,h3,p,dl,dd{margin:0;padding:0}
ul{list-style:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-sans);font-size:15px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:1px solid var(--fg);outline-offset:4px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));transition:opacity .6s var(--ease),visibility .6s}
#loader.done{opacity:0;visibility:hidden}
#loader .count{font-family:var(--f-mono);font-size:20px;letter-spacing:.04em;opacity:.45;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.hdr{position:fixed;inset:0 0 auto;z-index:60;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:calc(22px + env(safe-area-inset-top,0px)) var(--gxr) 22px var(--gx);pointer-events:none}
.hdr > *{pointer-events:auto}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.35}
.brand .rl{color:var(--mute)}
.hdr-r{display:flex;align-items:flex-start;gap:28px}
.lang{display:flex;gap:6px;color:var(--faint)}
.lang button{color:var(--faint);transition:color .3s}
.lang button[aria-pressed="true"]{color:var(--fg)}
.lang button:hover{color:var(--fg)}
.about-btn{position:relative;overflow:hidden;height:1.4em;min-width:5.6em;text-align:right}
.about-btn span{position:absolute;right:0;top:0;white-space:nowrap;transition:transform .55s var(--ease),opacity .3s}
.about-btn .ab-b{transform:translateY(110%)}
body.drawer-open .about-btn .ab-a{transform:translateY(-110%)}
body.drawer-open .about-btn .ab-b{transform:translateY(0)}
.about-btn:hover span{opacity:.5}
body.in-case .hdr{background:linear-gradient(var(--bg) 55%, rgba(8,8,8,0))}

/* ---------- home stage ---------- */
#home{position:fixed;inset:0;transition:opacity .6s var(--ease),transform .8s var(--ease),filter .6s}
body.drawer-open #home{opacity:.32;transform:translateX(-4vw) scale(.97)}
body.in-case #home{opacity:0;pointer-events:none}
#scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;transform:translateY(-4vh);user-select:none;-webkit-user-select:none}
#scene.grabbing{cursor:grabbing}
#ring{position:relative;width:0;height:0;transform-style:preserve-3d}
.card{position:absolute;left:0;top:0;transform-style:preserve-3d}
.strip{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:var(--panel);background-image:var(--cover);background-repeat:no-repeat;will-change:transform}
.strip i{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.cta{position:absolute;left:50%;top:calc(50% - 4vh);transform:translate(-50%,-50%);z-index:5;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  padding:13px 22px;border:1px solid rgba(236,234,228,.75);background:rgba(8,8,8,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:background .3s,color .3s,opacity .25s}
.cta:hover{background:var(--fg);color:var(--bg)}
.caption{position:absolute;left:0;right:0;top:calc(50% - 4vh + var(--cardH,40vh)/2 + 26px);display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 var(--gxr) 0 var(--gx);text-align:center;pointer-events:none}
.cap-title{font-size:clamp(17px,1.6vw,21px);font-weight:500;letter-spacing:-.01em;text-wrap:balance;transition:opacity .35s,transform .45s var(--ease)}
.cap-title.swap{opacity:0;transform:translateY(6px)}
.prog{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.prog .dash{width:14px;height:1px;background:var(--faint);transition:width .5s var(--ease),background .3s}
.prog .dash.on{width:40px;background:var(--fg)}
.prog .n{margin:0 8px}
.foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;gap:16px;padding:0 var(--gxr) calc(24px + env(safe-area-inset-bottom,0px)) var(--gx);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--mute);pointer-events:none}
@media (max-width:759px){ .foot .hint{display:none} .foot{justify-content:center} .hdr-r{gap:16px} .brand{font-size:14px} }

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
body.drawer-open #scrim{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;right:0;bottom:0;z-index:55;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .75s var(--ease);overflow-y:auto;overscroll-behavior:contain}
body.drawer-open #drawer{transform:translateX(0)}
.dr-inner{padding:calc(110px + env(safe-area-inset-top,0px)) var(--gxr) calc(56px + env(safe-area-inset-bottom,0px)) var(--gx);display:flex;flex-direction:column;gap:44px}
@media (min-width:760px){ .dr-inner{padding-left:48px;padding-right:max(40px, env(safe-area-inset-right,0px))} }
.dr-name{font-size:clamp(28px,3vw,36px);font-weight:500;letter-spacing:-.02em;line-height:1.1}
.dr-role{color:var(--mute);margin-top:8px}
.dr-text{display:flex;flex-direction:column;gap:14px;font-size:16px;line-height:1.6;max-width:60ch}
.dr-block{display:flex;flex-direction:column;gap:16px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rows li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.rows .r-t{font-weight:500}
.rows .r-s{color:var(--mute)}
.rows .r-d{font-family:var(--f-mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.rows .r-x{grid-column:1 / -1;color:var(--mute);font-size:14px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;color:rgba(236,234,228,.82)}
.contact-links{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.c-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;min-width:0}
.c-row .c-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);flex:none;width:84px}
.c-row .c-v{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
a.c-row .c-v{user-select:auto}
a.c-row:hover .c-v{opacity:.6}
.copy{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:7px 11px;border-radius:999px;transition:background .25s,color .25s,border-color .25s;flex:none}
.copy:hover{border-color:var(--fg)}
.copy.ok{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* ---------- case study ---------- */
#case{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility .6s}
body.in-case #case{opacity:1;visibility:visible}
.cs{max-width:1240px;margin:0 auto;padding:calc(130px + env(safe-area-inset-top,0px)) var(--gxr) calc(140px + env(safe-area-inset-bottom,0px)) var(--gx);display:flex;flex-direction:column;gap:clamp(64px,9vw,120px)}
.cs > *{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .9s var(--ease)}
body.in-case .cs > *{opacity:1;transform:none}
body.in-case .cs > *:nth-child(2){transition-delay:.08s}
body.in-case .cs > *:nth-child(3){transition-delay:.16s}
.cs-head{display:flex;flex-direction:column;gap:22px}
.cs-title{font-size:clamp(38px,6.4vw,92px);line-height:.98;letter-spacing:-.035em;font-weight:500;text-wrap:balance;max-width:16ch}
.cs-sub{font-size:clamp(17px,1.7vw,22px);color:var(--mute);max-width:48ch;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags li{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:6px 10px;border-radius:2px;color:rgba(236,234,228,.8)}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);margin-top:18px}
.meta > div{padding:16px 16px 0 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.meta dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.meta dd{font-size:14px}
@media (max-width:759px){ .meta{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px} }
.cs-hero{margin:0;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--panel)}
.cs-hero img{width:100%;height:100%;object-fit:cover;display:block}
.sec{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px 48px;border-top:1px solid var(--line);padding-top:28px}
.sec-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:400}
.sec-r{min-width:0;display:flex;flex-direction:column;gap:20px}
.sec-r > p{max-width:64ch;font-size:16px;line-height:1.65;color:rgba(236,234,228,.86)}
.sec-r .lead{font-size:clamp(20px,2.1vw,27px);line-height:1.35;letter-spacing:-.015em;color:var(--fg);max-width:34ch;text-wrap:pretty}
@media (max-width:759px){ .sec{grid-template-columns:1fr} }
.sol{border-left:1px solid var(--accent);padding:4px 0 4px 20px;display:flex;flex-direction:column;gap:8px;max-width:64ch}
.sol p:last-child{font-size:16px;line-height:1.65}

/* pipeline */
.flow-wrap{overflow-x:auto;padding-bottom:6px;margin-right:calc(-1 * var(--gxr))}
.flow{display:flex;align-items:stretch;gap:0;min-width:max-content;padding-right:var(--gxr)}
.node{width:176px;flex:none;border:1px solid var(--line);background:var(--panel);padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px}
.node .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}
.node .k::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.node.ai{border-color:rgba(124,195,174,.55)}
.node.ai .k{color:var(--accent)}
.node.ai .k::before{background:var(--accent)}
.node .nm{font-weight:500;font-size:14px;line-height:1.3}
.node .dt{font-size:13px;color:var(--mute);line-height:1.45}
.arrow{width:34px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--faint)}
@media (max-width:759px){
  .flow-wrap{overflow:visible;margin-right:0}
  .flow{flex-direction:column;min-width:0;padding-right:0}
  .node{width:auto}
  .arrow{width:auto;height:26px;transform:rotate(90deg)}
}
.shot{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.shot img{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--panel);cursor:zoom-in}
.shot figcaption{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--mute)}

/* demo */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--line);color:var(--mute);transition:all .25s}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs button:hover{color:var(--fg);border-color:var(--faint)}
.frame{position:relative;aspect-ratio:16/9;max-width:100%;background:#E9E8E4;border:1px solid var(--line);overflow:hidden}
.frame img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.frame .live{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--panel-2);color:var(--fg);text-align:center;padding:24px}
.frame .live p{color:var(--mute);max-width:46ch;font-size:14px}
.btn-line{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:12px 18px;border:1px solid rgba(236,234,228,.7);transition:background .25s,color .25s;text-decoration:none;display:inline-flex;gap:10px;align-items:center}
.btn-line:hover{background:var(--fg);color:var(--bg)}
.demo-note{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;font-size:13px;color:var(--mute)}
.demo-note a{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);text-decoration:none;border-bottom:1px solid var(--faint);padding-bottom:2px}
.gallery{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.gallery.two{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);align-items:start}
.gallery.one-tall{grid-template-columns:minmax(0,5fr) minmax(0,4fr);align-items:start}
@media (max-width:759px){ .gallery.two,.gallery.one-tall{grid-template-columns:minmax(0,1fr)} }
.g-note{display:flex;flex-direction:column;gap:14px;font-size:15px;color:rgba(236,234,228,.86);max-width:44ch}
.g-note li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.g-note li span:first-child{font-family:var(--f-mono);font-size:11px;color:var(--accent)}

/* results */
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
.res li{border-top:1px solid var(--line);padding:20px 0 24px;display:flex;flex-direction:column;gap:8px;min-width:0}
.res .rk{font-size:clamp(28px,3.2vw,44px);font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.res .rk.neg{color:var(--neg)}
.res .rk.pos{color:var(--accent)}
.res .rt{color:var(--mute);font-size:15px;line-height:1.55;max-width:46ch}
@media (max-width:759px){ .res{grid-template-columns:minmax(0,1fr)} }
.skills-h{margin-top:12px}
.next{display:flex;flex-direction:column;gap:12px;text-decoration:none;border-top:1px solid var(--line);padding-top:28px}
.next .nt{font-size:clamp(30px,5vw,68px);font-weight:500;letter-spacing:-.035em;line-height:1;transition:opacity .3s;text-wrap:balance}
.next:hover .nt{opacity:.55}
.back{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:45;opacity:0;visibility:hidden;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:13px 20px;border-radius:999px;
  background:rgba(24,24,22,.82);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;
  transition:opacity .4s,transform .6s var(--ease),visibility .4s,background .25s,color .25s}
body.in-case .back{opacity:1;visibility:visible;transform:translate(-50%,0)}
.back:hover{background:var(--fg);color:var(--bg)}

/* lightbox */
#lb{position:fixed;inset:0;z-index:80;background:rgba(5,5,5,.94);display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) var(--gxr) calc(56px + env(safe-area-inset-bottom,0px)) var(--gx);cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#lb .lb-x{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:var(--gxr);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>


<div id="loader" aria-hidden="true"><div class="count" id="count">000</div></div>

<header class="hdr" id="hdr">
  <a class="brand" href="#" id="brand">
    <span>Valentin Prodhomme</span>
    <span class="rl" data-i18n="ui.role">Étudiant en contrôle de gestion</span>
  </a>
  <div class="hdr-r">
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button><span aria-hidden="true">|</span><button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button type="button" class="about-btn" id="aboutBtn" aria-expanded="false" aria-controls="drawer">
      <span class="ab-a" data-i18n="ui.about">À propos</span><span class="ab-b" data-i18n="ui.close">Fermer</span>
    </button>
  </div>
</header>

<main id="home">
  <div id="scene" role="region" aria-roledescription="carousel" aria-label="Projets"><div id="ring"></div></div>
  <button type="button" class="cta" id="cta"><span data-i18n="ui.cta">Voir l’étude de cas</span> <span aria-hidden="true">→</span></button>
  <div class="caption" aria-live="polite">
    <div class="cap-title" id="capTitle"></div>
    <div class="prog" id="prog"></div>
  </div>
  <div class="foot">
    <span class="hint" data-i18n="ui.hint">Glisser · ← → · Entrée</span>
    <span data-i18n="ui.status">Rennes · Prague · stage dès février 2027</span>
  </div>
</main>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="À propos et contact">
  <div class="dr-inner">
    <div>
      <p class="eyebrow" data-i18n="about.heading">À propos</p>
      <h2 class="dr-name" style="margin-top:14px">Valentin Prodhomme</h2>
      <p class="dr-role" data-i18n="about.role"></p>
    </div>
    <div class="dr-text" id="aboutText"></div>
    <div class="dr-block"><p class="eyebrow" data-i18n="ui.capsH">Compétences</p><ul class="chips" id="capsList"></ul></div>
    <div class="dr-block">
      <p class="eyebrow" data-i18n="ui.contactH">Contact</p>
      <p class="dr-text" style="font-size:16px" data-i18n="about.contact"></p>
      <div class="contact-links">
        <div class="c-row">
          <span class="c-l">E-mail</span>
          <span class="c-v" id="emailText">valentin.prodhomme04@gmail.com</span>
          <button type="button" class="copy" id="copyBtn" data-i18n="ui.copy">Copier l’adresse</button>
        </div>
        <a class="c-row" id="liLink" href="https://www.linkedin.com/in/valentin-prodhomme-716b9b250/" target="_blank" rel="noopener">

/* ===== Canvas covers ===== */
function drawCover(k){
  const c = document.createElement("canvas"); c.width = 1600; c.height = 1000;
  const g = c.getContext("2d");
  g.fillStyle = "#0d0d0c"; g.fillRect(0,0,1600,1000);
  const fitW = (im, x, y, w, alpha=1) => { if(!im) return; g.globalAlpha = alpha; g.drawImage(im, x, y, w, w*im.height/im.width); g.globalAlpha = 1; };
  const coverFit = (im) => { if(!im) return; const s = Math.max(1600/im.width, 1000/im.height)*1.04; const w = im.width*s, h = im.height*s; g.drawImage(im, (1600-w)/2, (1000-h)/2 - 20, w, h); };
  const panel = (im, x, y, w, r, maxH) => {
    if(!im) return; const h = Math.min(w*im.height/im.width, maxH || 1e9);
    g.save(); g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 60; g.shadowOffsetY = 24;
    g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = "#111"; g.fill(); g.restore();
    g.save(); g.beginPath(); g.roundRect(x, y, w, h, r); g.clip(); g.drawImage(im, x, y, w, w*im.height/im.width); g.restore();
  };
  if(k === 0){
    coverFit(imgs.pnl);
    g.fillStyle = "rgba(8,8,8,.30)"; g.fillRect(0,0,1600,1000);
  } else if(k === 1){
    const grd = g.createLinearGradient(0,0,1600,1000); grd.addColorStop(0,"#151514"); grd.addColorStop(1,"#0a0a0a"); g.fillStyle = grd; g.fillRect(0,0,1600,1000);
    fitW(imgs.wf_jobs, -80, 190, 1760, .5);
    panel(imgs.digest, 930, 120, 560, 14);
  } else {
    const grd = g.createLinearGradient(0,0,1600,1000); grd.addColorStop(0,"#141414"); grd.addColorStop(1,"#090909"); g.fillStyle = grd; g.fillRect(0,0,1600,1000);
    fitW(imgs.wf_mail, -120, 230, 1800, .55);
    panel(imgs.tg, 1070, 70, 400, 34);
  }
  // legibility gradients
  let gr = g.createLinearGradient(0, 380, 0, 1000); gr.addColorStop(0,"rgba(8,8,8,0)"); gr.addColorStop(1,"rgba(8,8,8,.92)");
  g.fillStyle = gr; g.fillRect(0,0,1600,1000);
  gr = g.createLinearGradient(0,0,0,260); gr.addColorStop(0,"rgba(8,8,8,.7)"); gr.addColorStop(1,"rgba(8,8,8,0)");
  g.fillStyle = gr; g.fillRect(0,0,1600,260);
  gr = g.createLinearGradient(0,0,1100,0); gr.addColorStop(0,"rgba(8,8,8,.55)"); gr.addColorStop(1,"rgba(8,8,8,0)");
  g.fillStyle = gr; g.fillRect(0,0,1600,1000);
  // text
  const p = T().projects[k];
  g.fillStyle = "rgba(236,234,228,.78)"; g.font = "500 24px 'Geist Mono', ui-monospace, monospace"; g.textBaseline = "alphabetic";
  g.fillText(p.tags.slice(0,3).join("  ·  ").toUpperCase(), 92, 120);
  g.textAlign = "right"; g.fillText(pad(k+1) + " / " + pad(N), 1508, 120); g.textAlign = "left";
  g.fillStyle = "#ECEAE4"; g.font = "500 92px Geist, 'Helvetica Neue', Arial, sans-serif";
  const lines = wrap(g, p.short, 1000);
  const lh = 96; let y = 905 - (lines.length-1)*lh;
  lines.forEach(l => { g.fillText(l, 88, y); y += lh; });
  return c.toDataURL("image/jpeg", .9);
}
function wrap(g, text, max){
  const words = text.split(" "); const out = []; let line = "";
  for(const w of words){ const t = line ? line + " " + w : w; if(g.measureText(t).width > max && line){ out.push(line); line = w; } else line = t; }
  if(line) out.push(line); return out;
}
function refreshCovers(){
  for(let k=0;k<N;k++){ covers[k] = drawCover(k); cards[k].el.style.setProperty("--cover", `url("${covers[k]}")`); }
}

/* ===== Carousel geometry ===== */
function buildRing(){
  ring.innerHTML = ""; cards.length = 0;
  for(let k=0;k<N;k++){
    const el = document.createElement("div"); el.className = "card"; el.dataset.k = k;
    const strips = [];
    for(let i=0;i<STRIPS;i++){
      const s = document.createElement("div"); s.className = "strip"; s.dataset.k = k;
      s.appendChild(document.createElement("i"));
      el.appendChild(s); strips.push(s);
    }
    ring.appendChild(el); cards.push({el, strips});
  }
}
function layout(){
  const vw = innerWidth, vh = innerHeight, mobile = vw < 760;
  W = mobile ? vw*0.84 : Math.min(vw*0.56, 1080);
  H = W/1.6;
  const maxH = vh*(mobile ? 0.46 : 0.58);
  if(H > maxH){ H = maxH; W = H*1.6; }
  R = W*1.18; SP = W/R + 0.1;
  sw = W/STRIPS;
  offs = Array.from({length:STRIPS}, (_,i) => (i - (STRIPS-1)/2) * sw / R);
  scene.style.perspective = (W*1.9) + "px";
  ring.style.transform = `translateZ(${-R}px)`;
  document.documentElement.style.setProperty("--cardH", H + "px");
  cards.forEach(c => c.strips.forEach((s,i) => {
    s.style.width = (sw + 1.2) + "px"; s.style.height = H + "px";
    s.style.left = (-sw/2) + "px"; s.style.top = (-H/2) + "px";
    s.style.backgroundSize = `${W}px ${H}px`;
    s.style.backgroundPosition = `${-i*sw}px 0`;
  }));
  renderedPos = NaN;
}
const wrapD = k => { let d = ((k - pos) % N + N) % N; if(d >= N/2) d -= N; return d; };
function render(){
  for(let k=0;k<N;k++){
    const d = wrapD(k), ca = d*SP, ad = Math.abs(d);
    const op = Math.max(0, Math.min(1, (1.5 - ad)/0.4));
    const dim = Math.min(.62, ad*.55);
    const c = cards[k];
    for(let i=0;i<STRIPS;i++){
      const a = ca + offs[i], s = c.strips[i];
      s.style.transform = `rotateY(${a}rad) translateZ(${R}px)`;
      s.style.opacity = op;
      s.style.visibility = (Math.abs(a) > 1.52 || op === 0) ? "hidden" : "visible";
      s.firstChild.style.opacity = dim;
    }
  }
}
const mod = (n) => ((n % N) + N) % N;

/* ===== UI updates ===== */
function setCaption(){
  const p = T().projects[activeIdx];
  const el = $("#capTitle");
  el.classList.add("swap");
  setTimeout(() => { el.textContent = p.title; el.classList.remove("swap"); }, reduced ? 0 : 180);
  $("#prog").innerHTML = `<span class="n">${pad(activeIdx+1)}</span>` +
    PROJECTS.map((_,i) => `<span class="dash${i===activeIdx?" on":""}"></span>`).join("") +
    `<span class="n">${pad(N)}</span>`;
}
function tick(){
  if(!dragging){
    const diff = target - pos;
    pos = (reduced || Math.abs(diff) < 1e-4) ? target : pos + diff*0.095;
  }
  const v = pos - lastPos; lastPos = pos;
  if(pos !== renderedPos){ render(); renderedPos = pos; }
  const a = mod(Math.round(pos));
  if(a !== activeIdx){ activeIdx = a; setCaption(); }
  const off = Math.abs(pos - Math.round(pos));
  const cta = $("#cta");
  const show = !dragging && off < 0.08;
  cta.style.opacity = show ? 1 : 0;
  cta.style.pointerEvents = show ? "auto" : "none";
  if(!reduced){
    const s = Math.min(7, Math.abs(v)*420);
    scene.style.filter = s > 0.4 ? `drop-shadow(${s}px 0 0 rgba(255,70,70,.32)) drop-shadow(${-s}px 0 0 rgba(70,200,255,.32))` : "";
  }
  requestAnimationFrame(tick);
}
function step(n){ target = Math.round(target) + n; }
function goTo(k){ target = Math.round(pos + wrapD(k)); }

/* ===== Pointer / keyboard / wheel ===== */
scene.addEventListener("pointerdown", e => {
  if(e.button !== 0 || caseIdx >= 0) return;
  dragging = true; scene.classList.add("grabbing");
  drag = {x:e.clientX, p:pos, moved:0, lx:e.clientX, lt:performance.now(), v:0};
  try { scene.setPointerCapture(e.pointerId); } catch(_){}
});
scene.addEventListener("pointermove", e => {
  if(!drag) return;
  const dx = e.clientX - drag.x;
  drag.moved = Math.max(drag.moved, Math.abs(dx));
  pos = drag.p - dx/(W*0.95); target = pos;
  const now = performance.now(), dt = Math.max(1, now - drag.lt);
  const inst = -(e.clientX - drag.lx)/(W*0.95)/dt;
  drag.v = drag.v*0.6 + inst*0.4; drag.lx = e.clientX; drag.lt = now;
});
function endDrag(e){
  if(!drag) return;
  dragging = false; scene.classList.remove("grabbing");
  if(drag.moved < 6){
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const s = hit && hit.closest(".strip");
    if(s){
      const k = +s.dataset.k;
      if(k === activeIdx && Math.abs(pos - Math.round(pos)) < 0.05) openCase(k);
      else goTo(k);
    } else target = Math.round(pos);
  } else {
    const fling = Math.max(-1.2, Math.min(1.2, drag.v*220));
    target = Math.round(pos + fling);
  }
  drag = null;
}
scene.addEventListener("pointerup", endDrag);
scene.addEventListener("pointercancel", endDrag);
let wheelAcc = 0, wheelLock = 0;
scene.addEventListener("wheel", e => {
  e.preventDefault();
  const now = performance.now(); if(now < wheelLock) return;
  wheelAcc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(Math.abs(wheelAcc) > 40){ step(Math.sign(wheelAcc)); wheelAcc = 0; wheelLock = now + 480; }
}, {passive:false});
document.addEventListener("keydown", e => {
  if(!$("#lb").hidden){ if(e.key === "Escape") closeLb(); return; }
  if(e.key === "Escape"){ if(document.body.classList.contains("drawer-open")) toggleDrawer(false); else if(caseIdx >= 0) closeCase(); return; }
  if(caseIdx >= 0 || document.body.classList.contains("drawer-open")) return;
  if(e.key === "ArrowRight"){ step(1); e.preventDefault(); }
  if(e.key === "ArrowLeft"){ step(-1); e.preventDefault(); }
  if(e.key === "Enter" && document.activeElement === document.body){ openCase(activeIdx); }
});
$("#cta").addEventListener("click", () => openCase(activeIdx));

/* ===== Drawer ===== */
function toggleDrawer(open){
  const b = document.body; open = open ?? !b.classList.contains("drawer-open");
  b.classList.toggle("drawer-open", open);
  $("#aboutBtn").setAttribute("aria-expanded", open);
  $("#drawer").setAttribute("aria-hidden", !open);
  $("#aboutBtn").setAttribute("aria-label", open ? T().ui.close : T().ui.about);
}
$("#aboutBtn").addEventListener("click", () => toggleDrawer());
$("#scrim").addEventListener("click", () => toggleDrawer(false));
$("#copyBtn").addEventListener("click", () => {
  const btn = $("#copyBtn"), email = $("#emailText").textContent.trim();
  const done = (txt) => { btn.textContent = txt; btn.classList.add("ok"); clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = T().ui.copy; btn.classList.remove("ok"); }, 1800); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#emailText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done(T().ui.copyFail); };
  try { navigator.clipboard.writeText(email).then(() => done(T().ui.copied), fallback); } catch(_){ fallback(); }
});

/* ===== Case study ===== */
const arrowSvg = `<svg width="22" height="10" viewBox="0 0 22 10" fill="none" aria-hidden="true"><path d="M0 5h20M16 1l4 4-4 4" stroke="currentColor" stroke-width="1"/></svg>`;
function renderCase(k){
  const t = T(), p = t.projects[k], P = PROJECTS[k], nk = (k+1)%N;
  const flow = p.flow.map((n,i) => (i ? `<div class="arrow">${arrowSvg}</div>` : "") +
    `<div class="node${n.ai?" ai":""}"><span class="k">${esc(n.k)}</span><span class="nm">${esc(n.n)}</span><span class="dt">${esc(n.d)}</span></div>`).join("");
  let demo = "";
  if(P.demo === "pbi"){
    demo = `<div class="tabs" role="tablist">${t.ui.tabs.map((x,i) => `<button type="button" role="tab" data-tab="${i}" aria-selected="${i===demoTab}">${esc(x)}</button>`).join("")}</div>
      <div class="frame" id="pbiFrame"></div>
      <div class="demo-note"><span>${esc(t.ui.pbiNote)}</span><a href="${PBI_URL}" target="_blank" rel="noopener">${esc(t.ui.openPbi)}</a></div>`;
  } else if(k === 1){
    demo = `<div class="gallery one-tall">
      <figure class="shot"><img src="${IMG.digest}" alt="${esc(p.galleryCaps[0])}" data-zoom loading="lazy"><figcaption>${esc(p.galleryCaps[0])}</figcaption></figure>
      <ul class="g-note">${p.galleryNotes.map((x,i) => `<li><span>${pad(i+1)}</span><span>${esc(x)}</span></li>`).join("")}</ul></div>`;
  } else {
    demo = `<div class="gallery two">
      <figure class="shot"><img src="${IMG.gmail}" alt="${esc(p.galleryCaps[0])}" data-zoom loading="lazy"><figcaption>${esc(p.galleryCaps[0])}</figcaption></figure>
      <figure class="shot"><img src="${IMG.tg}" alt="${esc(p.galleryCaps[1])}" data-zoom loading="lazy"><figcaption>${esc(p.galleryCaps[1])}</figcaption></figure></div>`;
  }
  $("#case").innerHTML = `<article class="cs">
    <div class="cs-head">
      <p class="eyebrow">${esc(t.ui.caseLabel)} · ${pad(k+1)} / ${pad(N)}</p>
      <h1 class="cs-title">${esc(p.title)}</h1>
      <p class="cs-sub">${esc(p.subtitle)}</p>
      <ul class="tags">${p.tags.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <dl class="meta">${p.meta.map(([a,b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl>
    </div>
    <figure class="cs-hero"><img src="${covers[k] || ""}" alt="${esc(p.title)}"></figure>
    <section class="sec"><h2 class="sec-l">${esc(t.ui.secContext)}</h2><div class="sec-r">
      <p class="eyebrow">${esc(t.ui.problem)}</p>
      <p class="lead">${esc(p.problem)}</p>
      ${p.context.map(x => `<p>${esc(x)}</p>`).join("")}
      <div class="sol"><p class="eyebrow">${esc(t.ui.solution)}</p><p>${esc(p.solution)}</p></div>
    </div></section>
    <section class="sec"><h2 class="sec-l">${esc(t.ui.secArch)}</h2><div class="sec-r">
      <div class="flow-wrap"><div class="flow" role="list" aria-label="${esc(t.ui.flowAria)}">${flow}</div></div>
      <figure class="shot"><img src="${IMG[P.wf]}" alt="${esc(p.wfCap)}" data-zoom loading="lazy"><figcaption>${esc(p.wfCap)}</figcaption></figure>
    </div></section>
    <section class="sec"><h2 class="sec-l">${esc(t.ui.secDemo)}</h2><div class="sec-r">${demo}</div></section>
    <section class="sec"><h2 class="sec-l">${esc(t.ui.secResults)}</h2><div class="sec-r">
      <ul class="res">${p.results.map(r => `<li><span class="rk${r.c?" "+r.c:""}">${esc(r.k)}</span><span class="rt">${esc(r.t)}</span></li>`).join("")}</ul>
      <p class="eyebrow skills-h">${esc(t.ui.skills)}</p>
      <ul class="chips">${p.skills.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    </div></section>
    <a class="next" href="#${PROJECTS[nk].id}" data-next="${nk}"><span class="eyebrow">${esc(t.ui.next)} →</span><span class="nt">${esc(t.projects[nk].title)}</span></a>
  </article>`;
  if(P.demo === "pbi") setDemoTab(demoTab);
}
function setDemoTab(i){
  demoTab = i; const t = T(), f = $("#pbiFrame"); if(!f) return;
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.setAttribute("aria-selected", +b.dataset.tab === i));
  if(i === 0){
    f.innerHTML = `<div class="live"><p class="eyebrow">Power BI · Publish to web</p><h3 style="font-size:22px;font-weight:500">${esc(t.ui.liveTitle)}</h3><p>${esc(t.ui.liveText)}</p><button type="button" class="btn-line" id="loadLive">${esc(t.ui.loadLive)} →</button></div>`;
    $("#loadLive").addEventListener("click", () => {
      f.innerHTML = `<iframe title="PBI Report N8N" src="${PBI_URL}" allowfullscreen="true" loading="lazy"></iframe>`;
    });
  } else {
    const key = ["","pnl","proc","model"][i];
    f.innerHTML = `<img src="${IMG[key]}" alt="${esc(t.ui.tabs[i])}" data-zoom>`;
  }
}
$("#case").addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]"); if(tab){ setDemoTab(+tab.dataset.tab); return; }
  const nx = e.target.closest("[data-next]"); if(nx){ e.preventDefault(); openCase(+nx.dataset.next); return; }
  const z = e.target.closest("img[data-zoom]"); if(z) openLb(z.src, z.alt);
});
function openCase(k, fromRoute){
  caseIdx = k; demoTab = 1;
  pos = target = Math.round(pos + wrapD(k));
  renderCase(k);
  document.body.classList.remove("in-case"); void document.body.offsetWidth;
  document.body.classList.add("in-case");
  $("#case").setAttribute("aria-hidden","false"); $("#case").scrollTop = 0;
  toggleDrawer(false);
  if(!fromRoute){ try { if(location.hash !== "#"+PROJECTS[k].id) history.pushState(null, "", "#"+PROJECTS[k].id); } catch(_){} }
}
function closeCase(fromRoute){
  if(caseIdx < 0) return;
  caseIdx = -1;
  document.body.classList.remove("in-case");
  $("#case").setAttribute("aria-hidden","true");
  if(!fromRoute){ try { history.pushState(null, "", location.pathname + location.search); } catch(_){} }
}
$("#backBtn").addEventListener("click", () => closeCase());
$("#brand").addEventListener("click", e => { e.preventDefault(); toggleDrawer(false); closeCase(); });
function route(){
  const id = (location.hash || "").slice(1);
  const k = PROJECTS.findIndex(p => p.id === id);
  if(k >= 0) openCase(k, true); else closeCase(true);
}
addEventListener("hashchange", route);
addEventListener("popstate", route);

/* ===== Lightbox ===== */
function openLb(src, alt){ const lb = $("#lb"); lb.querySelector("img").src = src; lb.querySelector("img").alt = alt || ""; lb.hidden = false; }
function closeLb(){ $("#lb").hidden = true; }
$("#lb").addEventListener("click", closeLb);

/* ===== i18n ===== */
function get(obj, path){ return path.split(".").reduce((o,k) => o && o[k], obj); }
function applyLang(l){
  lang = l; try { localStorage.setItem("vp-lang", l); } catch(_){}
  document.documentElement.lang = l;
  const t = T();
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = get(t, el.dataset.i18n); if(typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  scene.setAttribute("aria-label", t.ui.carousel);
  $("#aboutText").innerHTML = t.about.paragraphs.map(p => `<p>${esc(p)}</p>`).join("");
  $("#capsList").innerHTML = t.about.caps.map(x => `<li>${esc(x)}</li>`).join("");
  $("#drawer").setAttribute("aria-label", t.about.heading + " · " + t.ui.contactH);
  if(cards.length && Object.keys(imgs).length) refreshCovers();
  setCaption();
  if(caseIdx >= 0){ const st = $("#case").scrollTop; const tab = demoTab; renderCase(caseIdx); setDemoTab(tab); $("#case").scrollTop = st; }
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
if(GITHUB_URL){ const a = $("#ghLink"); a.href = GITHUB_URL; a.hidden = false; $("#ghText").textContent = GITHUB_URL.replace(/^https?:\/\/(www\.)?/, ""); }

/* ===== Boot ===== */
(async function boot(){
  buildRing(); layout(); applyLang(lang); render();
  addEventListener("resize", layout);
  requestAnimationFrame(tick);
  const t0 = performance.now(), dur = reduced ? 0 : 900, cnt = $("#count");
  const count = () => { const p = Math.min(1, (performance.now()-t0)/Math.max(1,dur)); cnt.textContent = String(Math.round(p*100)).padStart(3,"0"); if(p < 1) requestAnimationFrame(count); };
  count();
  const fontsReady = (document.fonts && document.fonts.load) ? Promise.race([Promise.all([document.fonts.load("500 92px Geist"), document.fonts.load("500 24px 'Geist Mono'")]), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  await Promise.all([loadImages(), fontsReady]);
  refreshCovers();
  if(caseIdx >= 0){ const img = document.querySelector(".cs-hero img"); if(img) img.src = covers[caseIdx]; }
  const wait = Math.max(0, dur - (performance.now() - t0));
  setTimeout(() => $("#loader").classList.add("done"), wait + 120);
  if(location.hash) route();
})();
</script>
